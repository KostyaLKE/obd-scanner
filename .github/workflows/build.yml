name: Сборка APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Ключ подписи из Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Нет секрета KEYSTORE_BASE64"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > app/obd-scanner.jks

      - name: Тесты
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Сборка
        env:
          KEYSTORE_FILE: app/obd-scanner.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --console=plain
          cp app/build/outputs/apk/release/app-release.apk obd-scanner.apk

      - name: Удалить ключ
        if: always()
        run: rm -f app/obd-scanner.jks

      - name: Описание версии для автообновления
        env:
          RUN: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess, datetime
          apk = open("obd-scanner.apk", "rb").read()
          subject = subprocess.run(["git", "log", "-1", "--format=%s"], capture_output=True, text=True).stdout.strip()
          json.dump({
              "versionCode": int(os.environ["RUN"]),
              "versionName": "0.1." + os.environ["RUN"],
              "sha256": hashlib.sha256(apk).hexdigest(),
              "size": len(apk),
              "notes": subject,
              "commit": os.environ["SHA"],
              "date": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
          }, open("version.json", "w"), ensure_ascii=False, indent=1)
          print(open("version.json").read())
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: obd-scanner-apk
          path: obd-scanner.apk

      - name: Публикация в релиз «latest»
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest obd-scanner.apk version.json \
            --title "OBD Сканер (сборка ${{ github.run_number }})" \
            --notes "Последняя сборка из main, коммит ${{ github.sha }}. Скачайте obd-scanner.apk и установите на телефон." \
            --target ${{ github.sha }}
